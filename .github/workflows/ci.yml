name: ci

on:
  push:
  pull_request:

jobs:
  moon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Format
        run: moon fmt --check
      - name: Public interface
        run: |
          moon info
          git diff --exit-code -- '*.mbti'
      - name: Typecheck
        run: moon check --deny-warn
      - name: Build
        run: moon build --deny-warn
      - name: Test
        run: moon test --deny-warn
      - name: Demo
        run: moon run cmd/demo
      - name: Track CLI
        run: moon run cmd/track
      - name: Query CLI
        run: moon run cmd/query
      - name: Bench CLI
        run: moon run cmd/bench
